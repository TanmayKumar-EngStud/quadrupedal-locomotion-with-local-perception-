name: Tests
on: [push, workflow_dispatch]
jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --extra train --frozen
      - run: uv run --extra train pytest -q
